<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trang Demo</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        padding: 20px;
    }

    .container {
        background: rgba(255, 255, 255, 0.95);
        padding: 50px 40px;
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        text-align: center;
        max-width: 500px;
        width: 100%;
        transition: transform 0.3s ease;
    }

    .container:hover {
        transform: translateY(-5px);
    }

    h1 {
        color: #333;
        margin-bottom: 30px;
        font-size: 1.8rem;
    }

    #message {
        font-size: 1.2rem;
        color: #764ba2;
        font-weight: 600;
        margin: 20px 0;
        min-height: 30px;
        opacity: 0;
        transform: translateY(10px);
        transition: opacity 0.5s ease, transform 0.5s ease;
    }

    #message.show {
        opacity: 1;
        transform: translateY(0);
    }

    .btn {
        padding: 15px 40px;
        font-size: 1.1rem;
        font-weight: 600;
        color: #fff;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border: none;
        border-radius: 50px;
        cursor: pointer;
        box-shadow: 0 8px 20px rgba(118, 75, 162, 0.4);
        transition: all 0.3s ease;
        margin-top: 20px;
    }

    .btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 12px 25px rgba(118, 75, 162, 0.6);
    }

    .btn:active {
        transform: translateY(0);
    }
</style>
</head>
<body>

<div class="container">
    <h1>👋 Chào mừng bạn!</h1>
    <p id="message">✨ Bạn đã ấn nút lần đầu tiên!</p>
    <button class="btn" id="actionBtn">Ấn vào đây</button>
</div>

<script>
    const btn = document.getElementById('actionBtn');
    const message = document.getElementById('message');
    let clickCount = 0;

    btn.addEventListener('click', () => {
        clickCount++;

        if (clickCount === 1) {
            // Lần 1: hiện dòng chữ
            message.classList.add('show');
            btn.textContent = 'Ấn thêm lần nữa →';
        } else if (clickCount === 2) {
            // Lần 2: chuyển trang
            window.location.href = 'https://www.google.com';
            // Hoặc đổi thành trang bạn muốn: 'page2.html', 'https://facebook.com', ...
        }
    });
</script>

</body>
</html>
